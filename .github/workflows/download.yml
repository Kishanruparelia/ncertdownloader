name: Download NCERT Books

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run download script
      run: python bulk_download_all.py

    - name: Zip per class
      run: |
        mkdir zips
        for d in books/Class_*; do
          zip -r "zips/$(basename $d).zip" "$d"
        done

    - name: Upload ZIPs
      uses: actions/upload-artifact@v4
      with:
        name: ncert_class_zips
        path: zips/

